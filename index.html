<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Baldur's Gate 3 Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #16131f;
        --card: #1f1a2c;
        --bd: #362e4b;
        --tx: #e8e2d4;
        --mu: #a39bb5;
        --ac: #b48ef2;
        --ok: #e0a93f;
        --sk: #ee6b6b; /* skipped tasks */
        /* tag colours (dark mode: light text on a tinted background) */
        --boss: #ff8f82;
        --npc: #7cc0f5;
        --quest: #f0b84f;
        --loot: #8fd68a;
        --buff: #f09af0;
        --prereq: #e8e36a;
        --opt: #b8b1c9;
        --font-body: 'Alegreya Sans', 'Gill Sans', 'Gill Sans MT', Candara, 'Segoe UI', system-ui, sans-serif;
        --font-head: 'Cinzel', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #efecf5;
          --card: #ffffff;
          --bd: #d8d1e8;
          --tx: #25203a;
          --mu: #655d7e;
          --ac: #6a3fc4;
          --ok: #8a5a00;
          --sk: #b42318;
          /* tag colours (light mode: dark text on a pale tinted background) */
          --boss: #b02a1e;
          --npc: #145a99;
          --quest: #8a5a00;
          --loot: #1e6e1f;
          --buff: #9a2a98;
          --prereq: #675e00;
          --opt: #5d5575;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 400 1.1rem/1.45 var(--font-body);
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 18px 14px 60px;
      }
      h1 {
        margin: 0.1em 0 0.35em;
        font: 600 1.9rem/1.15 var(--font-head);
        letter-spacing: 0.02em;
        color: var(--ac);
      }
      .bar {
        height: 6px;
        background: var(--bd);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ac);
        transition: width 0.3s;
      }
      .mu {
        color: var(--mu);
      }
      nav,
      #tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
      }
      #subs {
        margin-top: -4px;
      }
      #subs[hidden] {
        display: none;
      }
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--ac);
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      nav .on {
        background: var(--ac);
        border-color: var(--ac);
        color: var(--bg);
      }
      nav small {
        opacity: 0.8;
      }
      /* Subact selector: smaller, outlined instead of filled, so it reads as second level */
      #subs button {
        font-size: 0.95rem;
        padding: 2px 10px;
        border-radius: 14px;
        background: transparent;
        color: var(--mu);
      }
      #subs .on {
        background: transparent;
        color: var(--ac);
        border-color: var(--ac);
        box-shadow: inset 0 0 0 1px var(--ac);
        font-weight: 700;
      }
      #tools label {
        margin-left: 10px;
      }
      .area {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        margin: 12px 0;
        overflow: hidden;
      }
      .area h3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 9px 12px;
        cursor: pointer;
        font: 600 1rem var(--font-head);
        letter-spacing: 0.02em;
      }
      .area h3 button {
        font: 400 0.85rem var(--font-body);
        padding: 1px 8px;
      }
      .area h3 b {
        font: 700 0.95rem var(--font-body);
        color: var(--mu);
        min-width: 3.2em;
        text-align: right;
      }
      .area h3 b.ok {
        color: var(--ok);
      }
      .pad {
        padding-bottom: 10px;
      }
      .pad p {
        margin: 6px 12px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        border-top: 1px solid var(--bd);
        padding: 7px 12px;
      }
      li label {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        cursor: pointer;
      }
      input[type='checkbox'] {
        accent-color: var(--ac);
        width: 1.05em;
        height: 1.05em;
        align-self: center;
      }
      /* Task checkboxes are drawn by hand so they can show a tick (done) or a cross (skipped) */
      li input[type='checkbox'] {
        -webkit-appearance: none;
        appearance: none;
        flex: none;
        display: grid;
        place-content: center;
        width: 1.15em;
        height: 1.15em;
        margin: 0;
        border: 2px solid var(--mu);
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }
      li input[type='checkbox']::before {
        content: '';
        width: 0.75em;
        height: 0.75em;
        transform: scale(0);
        background: var(--bg);
      }
      li input[type='checkbox']:checked {
        background: var(--ac);
        border-color: var(--ac);
      }
      li input[type='checkbox']:checked::before {
        transform: scale(1);
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      li.skip input[type='checkbox'] {
        border-color: var(--sk);
      }
      li.skip input[type='checkbox']::before {
        transform: scale(1);
        background: var(--sk);
        clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
      }
      li.done > .row label .tx {
        color: var(--mu);
        text-decoration: line-through;
      }
      li.skip > .row label .tx {
        color: var(--sk);
        text-decoration: line-through;
      }
      /* Row = checkbox label on the left, skip (trash) button on the right */
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .row label {
        flex: 1;
        min-width: 0;
      }
      button.del {
        flex: none;
        display: inline-flex;
        padding: 2px 6px;
        line-height: 1;
        color: var(--mu);
        background: transparent;
        border-color: transparent;
      }
      button.del:hover,
      button.del:focus-visible,
      button.del[aria-pressed='true'] {
        color: var(--sk);
        border-color: var(--sk);
      }
      .sub {
        margin: 4px 0 0 0.55em;
        padding-left: 0.9em;
        border-left: 2px solid var(--bd);
      }
      .sub li {
        border-top: 0;
        padding: 4px 0;
      }
      .req {
        margin: 1px 0 0 1.7em;
        font-size: 0.9rem;
        color: var(--mu);
      }
      .req a.met {
        color: var(--ok);
      }
      .req a.skipped {
        color: var(--sk);
      }
      li.flash > .row > label {
        animation: flash 1.6s;
      }
      @keyframes flash {
        0%,
        60% {
          background: color-mix(in srgb, var(--ac) 30%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        li.flash > .row > label {
          animation: none;
          background: color-mix(in srgb, var(--ac) 30%, transparent);
        }
        .bar i {
          transition: none;
        }
      }
      a {
        color: var(--ac);
      }

      /* ---- Tags: colour comes from --c, text + tint + border are derived from it ---- */
      .tg {
        --c: var(--mu);
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      }
      em.tg {
        font: 700 0.78rem/1.5 var(--font-body);
        font-style: normal;
        border-radius: 10px;
        padding: 0 8px;
      }
      button.tg {
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 14px;
        padding: 2px 11px;
      }
      button.tg:hover,
      button.tg:focus-visible {
        border-color: var(--c);
      }
      button.tg.off {
        --c: var(--mu);
        background: transparent;
        opacity: 0.6;
        text-decoration: line-through;
      }
      /* AND / OR switch: a two-segment toggle, the active side is filled */
      button.mode {
        display: inline-flex;
        padding: 2px;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 700;
      }
      button.mode span {
        padding: 2px 10px;
        border-radius: 12px;
        color: var(--mu);
      }
      button.mode span.on {
        background: var(--ac);
        color: var(--bg);
      }
      /* Custom tags: add a line like  .camp { --c: #0a7; }  to give your own tag a colour */
      .boss {
        --c: var(--boss);
      }
      .npc {
        --c: var(--npc);
      }
      .quest {
        --c: var(--quest);
      }
      .loot {
        --c: var(--loot);
      }
      .buff {
        --c: var(--buff);
      }
      .prereq {
        --c: var(--prereq);
      }
      .opt {
        --c: var(--opt);
      }
      code {
        background: var(--bd);
        padding: 0 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Baldur's Gate 3 Checklist</h1>
      <div class="bar"><i id="pb"></i></div>
      <div class="mu"><span id="tot"></span> done</div>
      <nav id="tabs"></nav>
      <nav id="subs" hidden></nav>
      <div id="tools">
        <input type="search" id="q" placeholder="Filter points of interest…" />
        <label><input type="checkbox" id="hd" /> Hide completed/skipped</label>
        <div id="tags"></div>
      </div>
      <div id="app"></div>
    </div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
  </body>
</html>
