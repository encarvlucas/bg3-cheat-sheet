<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Baldur's Gate 3 Checklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #16131f;
        --card: #1f1a2c;
        --bd: #362e4b;
        --tx: #e8e2d4;
        --mu: #a39bb5;
        --ac: #b48ef2;
        --ok: #e0a93f;
        /* tag colours (dark mode: light text on a tinted background) */
        --boss: #ff8f82;
        --npc: #7cc0f5;
        --quest: #f0b84f;
        --loot: #8fd68a;
        --buff: #f09af0;
        --prereq: #e8e36a;
        --opt: #b8b1c9;
        --font-body: 'Alegreya Sans', 'Gill Sans', 'Gill Sans MT', Candara, 'Segoe UI', system-ui, sans-serif;
        --font-head: 'Cinzel', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #efecf5;
          --card: #ffffff;
          --bd: #d8d1e8;
          --tx: #25203a;
          --mu: #655d7e;
          --ac: #6a3fc4;
          --ok: #8a5a00;
          /* tag colours (light mode: dark text on a pale tinted background) */
          --boss: #b02a1e;
          --npc: #145a99;
          --quest: #8a5a00;
          --loot: #1e6e1f;
          --buff: #9a2a98;
          --prereq: #675e00;
          --opt: #5d5575;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 400 1.1rem/1.45 var(--font-body);
        font-variant-numeric: tabular-nums;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 18px 14px 60px;
      }
      h1 {
        margin: 0.1em 0 0.35em;
        font: 600 1.9rem/1.15 var(--font-head);
        letter-spacing: 0.02em;
        color: var(--ac);
      }
      .bar {
        height: 6px;
        background: var(--bd);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ac);
        transition: width 0.3s;
      }
      .mu {
        color: var(--mu);
      }
      nav,
      #tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0;
      }
      #subs {
        margin-top: -4px;
      }
      #subs[hidden] {
        display: none;
      }
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--ac);
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      nav .on {
        background: var(--ac);
        border-color: var(--ac);
        color: var(--bg);
      }
      nav small {
        opacity: 0.8;
      }
      /* Subact selector: smaller, outlined instead of filled, so it reads as second level */
      #subs button {
        font-size: 0.95rem;
        padding: 2px 10px;
        border-radius: 14px;
        background: transparent;
        color: var(--mu);
      }
      #subs .on {
        background: transparent;
        color: var(--ac);
        border-color: var(--ac);
        box-shadow: inset 0 0 0 1px var(--ac);
        font-weight: 700;
      }
      #tools label {
        margin-left: 10px;
      }
      .area {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        margin: 12px 0;
        overflow: hidden;
      }
      .area h3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 9px 12px;
        cursor: pointer;
        font: 600 1rem var(--font-head);
        letter-spacing: 0.02em;
      }
      .area h3 button {
        font: 400 0.85rem var(--font-body);
        padding: 1px 8px;
      }
      .area h3 b {
        font: 700 0.95rem var(--font-body);
        color: var(--mu);
        min-width: 3.2em;
        text-align: right;
      }
      .area h3 b.ok {
        color: var(--ok);
      }
      .pad {
        padding-bottom: 10px;
      }
      .pad p {
        margin: 6px 12px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        border-top: 1px solid var(--bd);
        padding: 7px 12px;
      }
      li label {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
        cursor: pointer;
      }
      input[type='checkbox'] {
        accent-color: var(--ac);
        width: 1.05em;
        height: 1.05em;
        align-self: center;
      }
      li.done > label .tx {
        color: var(--mu);
        text-decoration: line-through;
      }
      .sub {
        margin: 4px 0 0 0.55em;
        padding-left: 0.9em;
        border-left: 2px solid var(--bd);
      }
      .sub li {
        border-top: 0;
        padding: 4px 0;
      }
      .req {
        margin: 1px 0 0 1.7em;
        font-size: 0.9rem;
        color: var(--mu);
      }
      .req a.met {
        color: var(--ok);
      }
      li.flash > label {
        animation: flash 1.6s;
      }
      @keyframes flash {
        0%,
        60% {
          background: color-mix(in srgb, var(--ac) 30%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        li.flash > label {
          animation: none;
          background: color-mix(in srgb, var(--ac) 30%, transparent);
        }
        .bar i {
          transition: none;
        }
      }
      a {
        color: var(--ac);
      }

      /* ---- Tags: colour comes from --c, text + tint + border are derived from it ---- */
      .tg {
        --c: var(--mu);
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      }
      em.tg {
        font: 700 0.78rem/1.5 var(--font-body);
        font-style: normal;
        border-radius: 10px;
        padding: 0 8px;
      }
      button.tg {
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 14px;
        padding: 2px 11px;
      }
      button.tg:hover,
      button.tg:focus-visible {
        border-color: var(--c);
      }
      button.tg.off {
        --c: var(--mu);
        background: transparent;
        opacity: 0.6;
        text-decoration: line-through;
      }
      /* Custom tags: add a line like  .camp { --c: #0a7; }  to give your own tag a colour */
      .boss {
        --c: var(--boss);
      }
      .npc {
        --c: var(--npc);
      }
      .quest {
        --c: var(--quest);
      }
      .loot {
        --c: var(--loot);
      }
      .buff {
        --c: var(--buff);
      }
      .prereq {
        --c: var(--prereq);
      }
      .opt {
        --c: var(--opt);
      }
      code {
        background: var(--bd);
        padding: 0 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Baldur's Gate 3 Checklist</h1>
      <div class="bar"><i id="pb"></i></div>
      <div class="mu"><span id="tot"></span> done</div>
      <nav id="tabs"></nav>
      <nav id="subs" hidden></nav>
      <div id="tools">
        <input type="search" id="q" placeholder="Filter points of interest…" />
        <label><input type="checkbox" id="hd" /> Hide completed</label>
        <div id="tags"></div>
      </div>
      <div id="app"></div>
    </div>

    <script>
      /* ============================================================
          EDIT ME: points of interest
          ------------------------------------------------------------
          TAGS     : tag id -> label shown on chips/filters. Add your own,
                     e.g.  camp:"Camp"  and give it a colour in the CSS:
                     .camp { --c: #0a7; }
          SUBACTS : subact id -> label shown in the selector under the Act tabs.
                     Optional: an id with no label is shown as its id.
          DATA     : acts -> areas -> items.
          area     : { id, subact, name, items }
                     - id must be unique; subact groups areas inside an act.
          item     : { id, title, tags, requires, subtasks }
                     - id       : unique and fixed. Progress is stored under it, so
                                  keep it if you reword the title.
                     - title    : text. Accepts links: [label](https://example.com)
                     - tags     : space-separated tag ids, optional ('')
                     - requires : ids of tasks to do first, optional. Shown as links
                                  under the item; clicking one jumps to it.
                     - subtasks : optional nested entries, same fields.
                                  Shown indented, checkboxes are independent of the parent.
          Trailing commas are fine.
        ============================================================ */
      const TAGS = {
        boss: 'Boss',
        npc: 'Companion/Ally',
        quest: 'Quest',
        loot: 'Loot',
        buff: 'Perm. Buff',
        prereq: 'Prerequisite',
        opt: 'Optional',
      }

      const SUBACTS = {
        wilderness: 'Wilderness',
        grove: 'Emerald Grove',
        goblins: 'Goblin Camp',
        risen: 'Risen Road',
        underdark: 'Underdark',
        creche: 'Mountain Pass',
        shadow: 'Shadow-Cursed Lands',
        'lower-city': 'Lower City',
        'upper-city': 'Upper City',
      }

      const DATA = [
        {
          name: 'Act 1',
          areas: [
            {
              id: 'beach',
              subact: 'wilderness',
              name: 'Ravaged Beach & Wilderness',
              items: [
                { id: 'shart', title: 'Recruit Shadowheart', tags: 'npc' },
                { id: 'laezel', title: "Recruit Lae'zel", tags: 'npc' },
                { id: 'astarion', title: 'Recruit Astarion', tags: 'npc' },
                { id: 'gale', title: 'Recruit Gale', tags: 'npc' },
                { id: 'early-mindflayer', title: 'Kill mindflayer in crashed out ship', tags: 'opt' },
                { id: 'withers', title: 'Explore abandoned church and free Withers', tags: 'npc opt' },
                { id: 'guidance', title: 'Explore around and find guidance amulet', tags: 'loot opt' },
              ],
            },
            {
              id: 'grove',
              subact: 'wilderness',
              name: 'Emerald Grove & Druid Grove',
              items: [
                { id: 'grove', title: 'Meet Zevlor, fight goblins and begin the Save the Grove quest', tags: 'quest npc' },
                { id: 'tief-assassin', title: 'Save tiefling from assassination, get her Soulcoin', tags: 'loot' },
                { id: 'wyll', title: 'Recruit Wyll', tags: 'npc' },
                { id: 'arabella', title: 'Save Arabella', tags: 'npc' },
                { id: 'harpies', title: 'Rescue Mirkon from Harpies, then talk to Mol', tags: 'opt prereq' },
                { id: 'kagha', title: 'Handle Kagha situation (shadow Druids)', tags: 'boss quest', requires: 'melphit' },
                {
                  id: 'silvanus-idol-mol',
                  title: 'Steal Idol of Silvanus and get Ring of Protection',
                  tags: 'quest loot opt',
                  requires: 'kagha',
                  subtasks: [{ id: 'silvanus-idol-permanent', title: 'Steal Idol back from Mol', tags: 'loot opt buff' }],
                },
                { id: 'karlach-engine-1', title: 'Talk to Dammon the blacksmith about Karlach engine', tags: 'npc loot buff', requires: 'karlach' },
              ],
            },
            {
              id: 'blighted',
              subact: 'wilderness',
              name: 'Blighted Village',
              items: [
                { id: 'blighted-entryway', title: 'Handle goblins in Blighted Village entryway', tags: 'prereq' },
                { id: 'windmill', title: 'Fight/handle goblins in windmill and free/kill gnome', tags: 'npc loot opt' },
                { id: 'ogres', title: 'Talk to Ogres and fight them or get their support', tags: 'boss opt' },
                { id: 'thay', title: 'Explore cellar, fight skeletons, pass mirror and find Necromancy of Thay', tags: 'opt buff' },
                { id: 'spiders', title: 'Fight phase spiders and grab Amethyst', tags: 'boss loot opt' },
                { id: 'barn-couple', title: "Fight 'couple' copulating in barn", tags: 'opt' },
              ],
            },
            {
              id: 'wild',
              subact: 'wilderness',
              name: 'Wilderness (South) Side Quests',
              items: [
                { id: 'owlbear', title: 'Fight Owlbear', tags: 'boss npc opt prereq' },
                { id: 'scratch', title: 'Rescue Scratch', tags: 'npc' },
                { id: 'karlach', title: 'Recruit Karlach', tags: 'npc' },
                { id: 'melphit', title: 'Fight melphits and Woads to find secret Kahga letter', tags: 'loot prereq opt' },
                { id: 'hag-redcaps', title: 'Fight Sheep (Redcaps) outside of hag lair', tags: 'opt' },
                {
                  id: 'ethel',
                  title: "Visit the Hag's Hut and deal with Auntie Ethel",
                  tags: 'boss quest loot opt',
                  subtasks: [
                    { id: 'hag-fight', title: 'Fight mask wearing hag minions then fight Ethel', tags: 'boss loot' },
                    { id: 'hag-hair', title: 'Obtain hag hair', tags: 'buff opt' },
                  ],
                },
              ],
            },
            {
              id: 'goblins',
              subact: 'wilderness',
              name: 'Goblin Camp',
              items: [
                { id: 'goblin-entrance', title: 'Fight/talk your way out of goblins in entrance to camp', tags: 'loot' },
                { id: 'crusher', title: 'Talk to Crusher and fight/get his ring', tags: 'loot' },
                { id: 'volo1', title: 'Free Volo', tags: 'npc', subtasks: [{ id: 'volo-eye', title: 'Talk to Volo in camp and get the magic eye', tags: 'buff' }] },
                { id: 'owlbear-cub', title: 'Free Owlbear cub', tags: 'npc', requires: ['owlbear'] },
                { id: 'branded', title: 'Get branded by Absolute', tags: 'buff opt' },
                { id: 'abdirak', title: "Get Loviatar's blessing from Abdirak", tags: 'buff opt' },
                { id: 'tortured-prisioner', title: 'Free/kill tortured prisioner', tags: 'opt' },
                {
                  id: 'goblin-decision',
                  title: 'Side with or against the goblin leaders',
                  tags: 'quest',
                  subtasks: [
                    { id: 'halsin', title: 'Free Halsin from the Goblin Camp', tags: 'quest npc' },
                    { id: 'gut', title: 'Defeat Priestess Gut', tags: 'quest boss' },
                    { id: 'dror-ragzlin', title: 'Defeat Dror Ragzlin', tags: 'quest boss' },
                    {
                      id: 'minty',
                      title: 'Defeat or ally with Minthara',
                      tags: 'quest boss',
                      subtasks: [{ id: 'knock-out-minty', title: 'Knock-out Minthara', tags: 'npc opt' }],
                    },
                  ],
                },
                { id: 'selune-temple-passage', title: "Go through Priestess Gut's room to the secret passage to the underdark", tags: 'opt' },
                { id: 'camp-fight', title: 'Kill all goblins in the camp', tags: 'opt' },
              ],
            },
            {
              id: 'risen',
              subact: 'wilderness',
              name: 'Risen Road Side Quests',
              items: [
                {
                  id: 'paladins-tyr',
                  title: 'Fight Paladins of Tyr',
                  tags: 'boss loot',
                  subtasks: [{ id: 'paladins-tyr-loot', title: 'Loot their Soulcoin and cellar', tags: 'loot' }],
                },
                { id: 'gnolls1', title: 'Fight Gnolls near bridge', tags: 'loot' },
                { id: 'gnolls2', title: 'Fight Gnolls near cave', tags: 'boss loot', subtasks: [{ id: 'strongbox', title: 'Steal Iron Flask from Zhentarim', tags: 'opt' }] },
                { id: 'fire', title: 'Rescue Commander Florrick', tags: 'quest npc' },
                { id: 'hideout', title: 'Check out Zhentarim hideout', tags: 'loot' },
                { id: 'gith-dragon', title: 'Handle Gith and go to mountain pass', tags: 'boss npc' },
              ],
            },
            {
              id: 'myconid',
              subact: 'underdark',
              name: 'Myconid Colony',
              items: [
                { id: 'colony', title: 'Meet Sovereign Spaw in the Myconid Colony', tags: 'npc' },
                {
                  id: 'sargent-boots',
                  title: "Get Thulla's boots",
                  tags: 'quest loot',
                  subtasks: [{ id: 'return-boots', title: 'Return boots to Sargent Thrinn', tags: 'loot' }],
                },
              ],
            },
            {
              id: 'underdark-quests',
              subact: 'underdark',
              name: 'Underdark Side Quests',
              items: [
                { id: 'omelum', title: "Do Omelum's quest, then buy his items", tags: 'quest loot' },
                { id: 'noblestalk', title: "Do Baelen and Derryth's quest and check out her stock", tags: 'quest loot' },
              ],
            },
            {
              id: 'grymforge',
              subact: 'underdark',
              name: 'Grymforge',
              items: [{ id: 'forge', title: 'Defeat Grym in Grymforge', tags: 'boss' }],
            },
            {
              id: 'monastery',
              subact: 'creche',
              name: 'Rosymorn Monastery',
              items: [{ id: 'grym', title: 'Defeat Grym in Grymforge', tags: 'boss' }],
            },
            {
              id: 'creche-yllek',
              subact: 'creche',
              name: "Crèche Y'llek",
              items: [{ id: 'grym', title: 'Defeat Grym in Grymforge', tags: 'boss' }],
            },
          ],
        },
        {
          name: 'Act 2',
          areas: [
            {
              id: 'shadow',
              subact: 'shadow',
              name: 'Shadow-Cursed Lands',
              items: [
                { id: 'last-light', title: 'Reach the Last Light Inn and meet Isobel', tags: 'npc' },
                // {id: 'reithwin', title: 'Explore Reithwin Town', tags: 'quest'},
                { id: 'gauntlet', title: 'Complete the Gauntlet of Shar', tags: 'quest npc' },
                { id: 'prisoners', title: 'Free the prisoners at Moonrise Towers', tags: 'quest opt' },
                { id: 'ketheric1', title: 'Defeat Ketheric Thorm', tags: 'boss' },
              ],
            },
          ],
        },
        {
          name: 'Act 3',
          areas: [
            {
              id: 'lower',
              subact: 'lower-city',
              name: 'Lower City',
              items: [{ id: 'sundries', title: 'Visit Sorcerous Sundries, buy stock', tags: 'quest loot' }],
            },
            {
              id: 'upper',
              subact: 'upper-city',
              name: "Upper City & Wyrm's Rock",
              items: [
                { id: 'cazador', title: 'Defeat Cazador Szarr', tags: 'boss quest npc' },
                { id: 'gortash', title: "Defeat Gortash at Wyrm's Rock", tags: 'boss' },
                { id: 'orin', title: 'Defeat Orin the Red', tags: 'boss' },
                { id: 'end', title: 'Confront the Netherbrain', tags: 'boss' },
              ],
            },
          ],
        },
      ]
      /* ======================== end of editable data ======================== */

      // ---------- Code (no need to edit below unless you're changing behaviour) ----------

      // localStorage key where all profiles and progress are saved
      const KEY = 'bg3_checklist_v1'
      // Shorthand for document.getElementById
      const $ = (id) => document.getElementById(id)
      // Escape HTML special characters so titles can't inject markup
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      // Escape, then turn [label](https://...) into a clickable link
      const fmt = (s) => esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      // Strip [label](url) down to just the label (used where links make no sense)
      const plain = (s) => s.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      // Make sure every task id is unique: a duplicate gets '_' appended until it is free
      const seen = {}
      const uniq = (k) => {
        while (seen[k]) k += '_'
        return (seen[k] = k)
      }

      // Build the item tree. A.list is the flat list (parents and subtasks) used for counts.
      // BY maps a task id -> { n: task, ar: its area, act: its act index }; used for "requires" links and jumping.
      // mk(area, actIndex, rawItem) converts one raw item from DATA into a normalised task node:
      //   t = title, g = array of tag ids, k = unique id, req = array of required task ids, sub = subtask nodes
      const BY = {}
      const mk = (A, ai, o) => {
        const t = o.title || o.name || ''
        const n = {
          t,
          // tags can be an array or a space-separated string
          g: Array.isArray(o.tags)
            ? o.tags
            : String(o.tags || '')
                .split(/\s+/)
                .filter(Boolean),
          // use the explicit id; if missing, derive one from the area id + title
          k: uniq(
            o.id ||
              A.id +
                ':' +
                t
                  .toLowerCase()
                  .replace(/[^a-z0-9]+/g, '-')
                  .slice(0, 40),
          ),
          // requires can be an array of ids or a space-separated string
          req: (o.requires?.split && o.requires?.split(' ')) || o.requires || [],
        }
        BY[n.k] = { n, ar: A, act: ai }
        A.list.push(n)
        n.sub = (o.subtasks || []).map((x) => mk(A, ai, x))
        return n
      }
      // Label for a subact id (falls back to the id itself)
      const subLabel = (id) => SUBACTS[id] || id
      // Normalise DATA into ACTS: each act has areas (with a task tree) and its list of subacts
      const ACTS = DATA.map((a, ai) => {
        const areas = a.areas.map((ar) => {
          const A = { id: ar.id, sub: ar.subact || '', name: ar.name, list: [] }
          A.tree = ar.items.map((x) => mk(A, ai, x))
          return A
        })
        return { name: a.name, areas, subs: [...new Set(areas.map((x) => x.sub).filter(Boolean))] }
      })
      // Flat list of all areas across all acts
      const AREAS = ACTS.flatMap((a) => a.areas)

      // ---------- State ----------
      // S = { cur: current profile name, profiles: { name: profile } }, loaded from localStorage
      let S
      try {
        S = JSON.parse(localStorage.getItem(KEY))
      } catch (e) {}
      if (!S || !S.profiles) S = { cur: 'Default', profiles: {} }
      // A fresh profile:
      //   done: task id -> 1 when checked      col: area id -> true when collapsed
      //   hideDone: hide completed tasks       off: tag id -> true when that tag filter is switched off
      //   tab: selected act (or Options)       sub: act index -> selected subact id
      const blank = () => ({ done: {}, col: {}, hideDone: false, off: {}, tab: 0, sub: {} })
      // Current profile (missing fields are filled in from blank(), so old saves keep working)
      const P = () => (S.profiles[S.cur] = Object.assign(blank(), S.profiles[S.cur]))
      // Persist state; ignore errors (e.g. storage blocked in private mode)
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(S))
        } catch (e) {}
      }
      // A task is visible unless ALL of its tags are switched off (untagged tasks always show)
      const vis = (p, it) => !it.g.length || it.g.some((t) => !p.off[t])

      // HTML for the "Requires: ..." line under a task; ticks the ones already done
      const reqs = (p, n) =>
        n.req.length
          ? `<div class="req">Requires: ${n.req
              .map((k) =>
                BY[k]
                  ? `<a href="#" data-goto="${esc(k)}" class="${p.done[k] ? 'met' : ''}">${p.done[k] ? '✓ ' : ''}${esc(plain(BY[k].n.t))}</a>`
                  : `<span title="No task has this id">unknown “${esc(k)}”</span>`,
              )
              .join(', ')}</div>`
          : ''

      // HTML for the Options tab: profile management and import/export
      function opts() {
        return `<section class="area pad"><h3>Profiles</h3><p><select id="prof">${Object.keys(S.profiles)
          .map((n) => `<option ${n == S.cur ? 'selected' : ''}>${esc(n)}</option>`)
          .join('')}</select>
      <button data-act="add">Add</button> <button data-act="ren">Rename</button> <button data-act="del">Delete</button></p>
      <h3>Data</h3><p><button data-act="exp">Export JSON</button> <button data-act="imp">Import JSON</button>
      <button data-act="reset">Reset this profile</button></p>
      <p class="mu">Progress is saved in this browser's localStorage (key <code>${KEY}</code>). Clearing site data erases it, so export a backup now and then.</p>
      <input type="file" id="file" accept=".json" hidden></section>`
      }

      // Re-draw the whole page from the current state. Called after every change.
      function render() {
        const p = P(),
          q = $('q').value.trim().toLowerCase()
        if (p.tab > ACTS.length) p.tab = 0
        const onOpts = p.tab == ACTS.length
        // tabs/subs/body collect HTML; all/alld are overall totals (tasks / done) for the progress bar
        let tabs = '',
          subs = '',
          body = '',
          all = 0,
          alld = 0
        // Loop over acts: build the tab button, and (for the selected act) the subact selector and areas
        ACTS.forEach((a, i) => {
          // n/d = tasks/done in this act, h = this act's area HTML
          let n = 0,
            d = 0,
            h = ''
          // cs = selected subact (or '' for all), sc = per-subact task/done counts
          const cs = a.subs.includes(p.sub[i]) ? p.sub[i] : '',
            sc = {}
          a.areas.forEach((ar) => {
            // v = tasks passing the tag filters, c = how many of those are done (counts ignore search/hide-completed)
            const v = ar.list.filter((it) => vis(p, it)),
              c = v.filter((it) => p.done[it.k]).length
            n += v.length
            d += c
            const s = (sc[ar.sub] = sc[ar.sub] || { n: 0, d: 0 })
            s.n += v.length
            s.d += c
            // Only build HTML for the selected act, and only for areas in the selected subact
            if (i != p.tab || (cs && ar.sub != cs)) return
            // A row shows if it matches the filters, or if any of its subtasks does.
            const row = (it) => {
              const sub = it.sub.map(row).join('')
              const ok = vis(p, it) && (!p.hideDone || !p.done[it.k]) && (!q || (it.t + ' ' + ar.name).toLowerCase().includes(q))
              if (!ok && !sub) return ''
              return `<li class="${p.done[it.k] ? 'done' : ''}"><label>
          <input type="checkbox" data-k="${esc(it.k)}" ${p.done[it.k] ? 'checked' : ''}><span class="tx">${fmt(it.t)}</span>
          ${it.g.map((t) => `<em class="tag tg ${esc(t)}">${esc(TAGS[t] || t)}</em>`).join('')}</label>${reqs(p, it)}${sub ? `<ul class="sub">${sub}</ul>` : ''}</li>`
            }
            // Skip areas with nothing to show; collapsed areas show only their header (a search forces them open)
            const rows = ar.tree.map(row).join('')
            if (!rows) return
            const open = q || !p.col[ar.id],
              id = esc(ar.id)
            h += `<section class="area"><h3 data-col="${id}"><span>${open ? '▾' : '▸'} ${esc(ar.name)}</span>
          <span><button data-all="${id}">Check all</button> <button data-none="${id}">Clear</button>
          <b class="${c == v.length ? 'ok' : ''}">${c == v.length ? 'Done' : c + '/' + v.length}</b></span></h3>`
            if (open) h += '<ul>' + rows + '</ul>'
            h += '</section>'
          })
          all += n
          alld += d
          tabs += `<button data-tab="${i}" class="${i == p.tab ? 'on' : ''}">${esc(a.name)} <small>${d}/${n}</small></button>`
          if (i == p.tab) {
            body = h || '<p class="mu">Nothing to show with the current filters.</p>'
            if (a.subs.length > 1)
              subs =
                `<button data-sub="" class="${cs ? '' : 'on'}">All <small>${d}/${n}</small></button>` +
                a.subs.map((s) => `<button data-sub="${esc(s)}" class="${s == cs ? 'on' : ''}">${esc(subLabel(s))} <small>${sc[s].d}/${sc[s].n}</small></button>`).join('')
          }
        })
        // Write everything into the page
        $('tabs').innerHTML = tabs + `<button data-tab="${ACTS.length}" class="${onOpts ? 'on' : ''}">Options</button>`
        $('subs').innerHTML = onOpts ? '' : subs
        $('subs').hidden = onOpts || !subs
        $('tools').hidden = onOpts
        // Tag filter chips (struck through when off) followed by the toggle-all button
        $('tags').innerHTML =
          Object.keys(TAGS)
            .map((t) => `<button class="chip tg ${esc(t)} ${p.off[t] ? 'off' : 'on'}" data-tag="${esc(t)}">${esc(TAGS[t])}</button>`)
            .join('') + `<button class="chip" data-tag-all="1" title="Toggle all tag filters">${Object.keys(TAGS).every((t) => p.off[t]) ? 'Enable all' : 'Disable all'}</button>`
        $('hd').checked = p.hideDone
        $('app').innerHTML = onOpts ? opts() : body
        $('tot').textContent = alld + '/' + all
        $('pb').style.width = (all ? (100 * alld) / all : 0) + '%'
      }

      // Jump to a task: switch act, expand its area, drop filters that would hide it, then highlight it.
      function jump(k) {
        const b = BY[k],
          p = P()
        if (!b) return
        p.tab = b.act
        p.sub[b.act] = b.ar.sub
        p.col[b.ar.id] = false
        $('q').value = ''
        if (p.done[k]) p.hideDone = false
        if (!vis(p, b.n)) b.n.g.forEach((t) => delete p.off[t])
        save()
        render()
        const box = [...document.querySelectorAll('input[data-k]')].find((x) => x.dataset.k == k)
        const li = box && box.closest('li')
        if (!li) return
        li.scrollIntoView({ block: 'center' })
        li.classList.add('flash')
        setTimeout(() => li.classList.remove('flash'), 1600)
      }

      // Handlers for the buttons on the Options tab: add/rename/delete profile, reset, export/import
      function act(a) {
        const names = Object.keys(S.profiles)
        if (a == 'add') {
          const n = (prompt('Profile name') || '').trim()
          if (n && !S.profiles[n]) S.cur = n
        }
        if (a == 'ren') {
          const n = (prompt('New name', S.cur) || '').trim()
          if (n && !S.profiles[n]) {
            S.profiles[n] = S.profiles[S.cur]
            delete S.profiles[S.cur]
            S.cur = n
          }
        }
        if (a == 'del' && names.length > 1 && confirm('Delete profile “' + S.cur + '”?')) {
          delete S.profiles[S.cur]
          S.cur = Object.keys(S.profiles)[0]
        }
        if (a == 'reset' && confirm('Reset all progress in this profile?')) P().done = {}
        if (a == 'exp') {
          const el = document.createElement('a')
          el.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }))
          el.download = 'bg3-checklist-' + new Date().toISOString().slice(0, 10) + '.json'
          el.click()
          URL.revokeObjectURL(el.href)
          return
        }
        if (a == 'imp') return $('file').click()
        save()
        render()
      }

      // One click handler for every button. Buttons carry data-* attributes saying what they do;
      // d(attr) finds the clicked element (or an ancestor) with that attribute.
      document.onclick = (e) => {
        const d = (x) => e.target.closest('[' + x + ']'),
          p = P()
        let el
        if ((el = d('data-goto'))) {
          e.preventDefault()
          return jump(el.dataset.goto)
        } else if ((el = d('data-tab'))) p.tab = +el.dataset.tab
        else if ((el = d('data-sub'))) p.sub[p.tab] = el.dataset.sub
        // Toggle all tag filters: if every tag is off, turn them all on; otherwise turn them all off
        else if ((el = d('data-tag-all'))) {
          const allOff = Object.keys(TAGS).every((t) => p.off[t])
          Object.keys(TAGS).forEach((t) => (p.off[t] = !allOff))
        } else if ((el = d('data-tag'))) p.off[el.dataset.tag] = !p.off[el.dataset.tag]
        // Check all / Clear: only affects tasks visible under the current tag filters
        else if ((el = d('data-all') || d('data-none'))) {
          const ar = AREAS.find((x) => x.id == (el.dataset.all || el.dataset.none))
          ar.list.filter((it) => vis(p, it)).forEach((it) => (el.dataset.all ? (p.done[it.k] = 1) : delete p.done[it.k]))
        }
        // Collapse / expand an area
        else if ((el = d('data-col'))) p.col[el.dataset.col] = !p.col[el.dataset.col]
        // Options tab buttons
        else if ((el = d('data-act'))) return act(el.dataset.act)
        else return // not a button we care about
        save()
        render()
      }

      // Handler for checkboxes, the profile dropdown and the import file picker
      document.onchange = (e) => {
        const t = e.target,
          p = P()
        if (t.dataset.k) {
          // task checkbox
          if (t.checked) p.done[t.dataset.k] = 1
          else delete p.done[t.dataset.k]
        } else if (t.id == 'hd') p.hideDone = t.checked
        else if (t.id == 'prof') S.cur = t.value
        // Import: read the chosen JSON file and replace all profiles after confirmation
        else if (t.id == 'file' && t.files[0]) {
          const fr = new FileReader()
          fr.onload = () => {
            try {
              const d = JSON.parse(fr.result)
              if (!d.profiles || !confirm('Replace all current profiles with the imported file?')) return
              S = d
              S.cur = S.profiles[S.cur] ? S.cur : Object.keys(S.profiles)[0]
              save()
              render()
            } catch (err) {
              alert('Invalid file: ' + err.message)
            }
          }
          fr.readAsText(t.files[0])
          return
        } else return
        save()
        render()
      }

      // Re-render as the search box changes, then draw the page for the first time
      $('q').oninput = render
      render()
    </script>
  </body>
</html>
